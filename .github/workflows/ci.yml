name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  # 머지된 결과도 검증한다. pull_request만 있으면 각 PR은 통과했는데 둘을 합친 dev는
  # 아무도 빌드해보지 않은 상태가 된다.
  push:
    branches:
      - dev
      - main

# 이 워크플로는 빌드만 한다. GITHUB_TOKEN에 그 이상의 권한을 주지 않는다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 태그는 다시 가리킬 수 있어 공급망 관점에서 신뢰 근거가 되지 못한다. v4 시점의
        # 커밋 SHA로 고정한다(버전 자체는 그대로).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 기본값(true)이면 checkout이 인증 토큰을 실행 환경에 심어두고, 그 뒤에
          # PR로 들어온 코드인 ./gradlew build가 실행된다(빌드 스크립트도 PR의 코드다).
          # 커밋·푸시를 하지 않는 워크플로이므로 토큰을 남길 이유가 없다.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트에 Testcontainers(MySQL)가 포함된다 — 러너의 Docker를 그대로 쓴다.
      - name: Build with Gradle
        run: ./gradlew build

      # 이미지 안에서 재빌드하지 않는다. 위에서 테스트를 통과한 바로 그 JAR을 넣어야
      # "검증한 산출물 = 배포할 산출물"이 성립한다 (Dockerfile 주석 참고).
      - name: Build container image
        run: docker build -t safedeal-backend:ci .

      # 이미지가 만들어지는 것과 실제로 뜨는 것은 다르다 — 컨테이너로 기동해서
      # health가 열릴 때까지 확인해야 배포 가능성이 검증된다.
      - name: Start local infra
        run: docker compose up -d --wait mysql redis kafka

      - name: Container smoke test
        run: |
          docker run -d --name app --network host \
            -e SPRING_PROFILES_ACTIVE=local \
            -e DB_URL='jdbc:mysql://127.0.0.1:3306/safedeal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=localdev \
            safedeal-backend:ci
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)
            if [ "$code" = "200" ]; then
              echo "컨테이너 기동 확인 (${i}회 시도)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::컨테이너가 90초 안에 health를 열지 못함"
          docker logs app
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f app 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
