# .env를 properties 소스로 읽으면 환경변수의 SERVER_PORT -> server.port 자동 변환 규칙이
# 적용되지 않는다. 명시적으로 매핑해줘야 .env의 값이 실제로 반영된다.
server:
  port: ${SERVER_PORT:8080}

spring:
  # .env는 Docker Compose 규약이라 Spring Boot가 자동으로 읽지 않는다. 이 선언이 없으면
  # .env를 받아 루트에 두고 IDE·gradlew로 실행해도 ${DB_URL}을 못 찾아 기동에 실패한다.
  # optional: 이므로 파일이 없어도 기동은 되고(운영은 실제 환경변수로 주입), 확장자가 .env라
  # 형식을 알 수 없으니 [.properties]로 파서를 지정한다. .env 자체는 .gitignore 대상이다.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Hibernate 7(Boot 4)에서 MySQL8Dialect는 제거됐다. 버전별 dialect 대신 MySQLDialect
        # 하나가 접속 시 서버 버전을 감지해 동작한다.
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
        # show_sql/format_sql은 운영 로그에 SQL·바인드 파라미터(개인정보 포함 가능)를 노출하므로
        # 공통 설정에서 제거했다 — 필요하면 application-local.yml에서만 켠다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: UTC
  data:
    web:
      pageable:
        # 안전망. Spring 기본 상한이 2000이라, 도메인에서 size 검증을 빠뜨리면 한 번에 2000건을
        # 조회하는 요청이 그대로 통과한다. 여기서 100으로 낮춰 최악의 경우를 막는다.
        # 다만 이 설정은 초과값을 400으로 거절하지 않고 조용히 100으로 깎으므로,
        # PageResponse.MAX_SIZE를 참조한 명시적 400 검증은 여전히 도메인 담당자 몫이다.
        max-page-size: 100
        default-page-size: 20
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # 직렬화기를 지정하지 않으면 Boot 기본값이 값까지 StringSerializer라, EventEnvelope 같은
      # 객체를 send()하면 직렬화 단계에서 바로 실패한다.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # 자바 클래스명을 타입 헤더(__TypeId__)로 실어 보내지 않는다. 계약의 기준은 클래스가
        # 아니라 eventType + eventVersion이며(EventEnvelope 참고), 클래스명을 계약처럼 쓰면
        # 프로듀서와 컨슈머가 다른 배포 버전일 때 리팩터링 한 번에 소비가 깨진다.
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 역직렬화 실패를 예외로 던지면 컨테이너가 같은 메시지를 무한 재시도한다(poison pill).
      # ErrorHandlingDeserializer로 감싸면 실패가 공통 에러 핸들러를 거쳐 DLT로 넘어간다.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # 프로듀서가 타입 헤더를 안 보내므로 컨슈머도 헤더를 보지 않고 아래 기본 타입으로 읽는다.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.safedeal.global.event.EventEnvelope
        # 역직렬화 대상 패키지 화이트리스트. "*"(전체 허용)는 역직렬화 가젯 체인 공격에
        # 노출되므로 절대 쓰지 않는다 — 이벤트 봉투 관련 패키지만 명시적으로 허용한다.
        spring.json.trusted.packages: com.safedeal.global.event,com.safedeal.**.event

# 프로파일 분리:
# - application-local.yml: 로컬 개발 전용 오버라이드(SQL 로깅 등 운영에 노출하면 안 되는 값,
#   app.security.dev-auth-enabled=true)
# - application-prod.yml: 운영 전용 오버라이드(springdoc 비활성화 등)
# 활성 프로파일은 SPRING_PROFILES_ACTIVE 환경변수로 주입한다. 이 파일(application.yml)은
# 모든 프로파일에 공통으로 적용되는 기본값만 담는다.

# API 문서는 기본 비활성화(fail-closed)한다. prod 프로파일에서만 끄는 구성이면 배포 시
# 프로파일을 빠뜨렸을 때 문서가 그대로 노출되므로, local에서만 켜는 방향으로 뒤집었다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    # X-Dev-*는 local 전용 개발 인증 필터가 읽는 헤더다. 여기 없으면 브라우저 preflight에서
    # 막혀 로컬 프런트엔드가 개발 인증을 아예 쓸 수 없다. 운영에서는 필터 자체가 비활성이라
    # 헤더를 허용해도 인증에 쓰이지 않는다.
    allowed-headers: Authorization,Content-Type,X-Request-Id,X-Dev-User-Id,X-Dev-Role
    exposed-headers: X-Request-Id
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: 3600
  security:
    dev-auth-enabled: false
  kafka:
    # 실제 토픽명은 도메인 담당자가 추가한다 (com.safedeal.global.config.KafkaTopicProperties 참고).
    # 예: app.kafka.topics.order-events: ${KAFKA_TOPIC_ORDER_EVENTS:safedeal.order.events.v1}
    consumer-group:
      # 도메인 side-effect 컨슈머(서버 2대 중 1대만 처리)는 아래처럼 고정 group id를 리스너에
      # 직접 지정한다 — 별도 프로퍼티 없이 문자열 리터럴로 충분하다.
      #   @KafkaListener(groupId = "safedeal-order-v1")
      # 채팅 WebSocket fan-out 컨슈머(모든 서버가 수신)는 서버별로 달라야 하므로 아래 값을 참조한다.
      #   @KafkaListener(groupId = "${app.kafka.consumer-group.chat-fanout}")
      chat-fanout: safedeal-chat-fanout-${INSTANCE_ID:local}

logging:
  level:
    org.hibernate.SQL: info

# 액추에이터는 health만 노출한다(fail-closed). prod에서만 좁히는 구성이면 배포 시
# 프로파일을 빠뜨렸을 때 넓은 기본값이 그대로 적용되므로, springdoc과 같은 방향으로 뒤집었다.
# prometheus/info는 지금 스크레이프하는 곳이 없어 열어둘 이유가 없다 — 모니터링을 도입할 때
# management 포트를 분리해 내부망 뒤에서 연다(운영 배포 게이트 항목).
# include는 "활성화" 목록일 뿐 접근 제어가 아니다. 인증 없이 열리는 경로 지정은
# global/config/SecurityConfig.java가 담당한다.
management:
  endpoints:
    web:
      exposure:
        include: health
